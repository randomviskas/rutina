<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina">
<title>Mūsų rutina</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#f4f2fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0c18" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f4f2fb; --card:#ffffff; --card2:#f8f7fd; --text:#17142b; --muted:#7b7891; --line:#ebe8f5;
  --glass:rgba(255,255,255,.78); --shadow:0 8px 24px rgba(60,30,140,.10); --shadow2:0 2px 8px rgba(60,30,140,.08);
  --sleep:#e9e6fb; --sleepT:#8b85b8; --work:#eef0f7; --workS:#e3e6f0; --danger:#ef4444; --ok:#10b981;
  --grad:linear-gradient(135deg,#6366f1 0%,#a855f7 45%,#ec4899 75%,#f59e0b 100%);
  --r:20px;
  --font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e0c18; --card:#1a1729; --card2:#211d33; --text:#f3f1ff; --muted:#9d99b8; --line:#2a2640;
    --glass:rgba(26,23,41,.8); --shadow:0 8px 24px rgba(0,0,0,.45); --shadow2:0 2px 8px rgba(0,0,0,.35);
    --sleep:#15122a; --sleepT:#6e68a0; --work:#1c1a2c; --workS:#222036; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
body{min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--card);border-radius:14px;padding:10px 14px;transition:transform .12s ease}
button:active{transform:scale(.96)}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
input:focus,select:focus{outline:2px solid #a855f7;outline-offset:0;border-color:transparent}
input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:#a855f7}
input[type=color]{padding:3px;height:44px}
h1,h2,h3,.rd{font-family:var(--font)}

/* ---------- Viršus ---------- */
header.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);display:flex;align-items:center;gap:12px}
.hello{flex:1;min-width:0}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.hello h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:flex}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:700 15px var(--font);
  background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 0 0 2.5px var(--bg)}
.pair .av+.av{margin-left:-10px}
.av.ph{background-size:cover;background-position:center;color:transparent}
.av.lg{width:52px;height:52px;font-size:20px}
.photo-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#hello .me{width:150px;height:150px;border-radius:50%;background-size:cover;background-position:center;border:5px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.3);position:relative;animation:beat 1.4s ease-in-out infinite}
#hello .me i{position:absolute;right:-6px;bottom:-4px;font-size:44px;font-style:normal}
.av.sm{width:22px;height:22px;font-size:11px;box-shadow:0 0 0 2px var(--card)}
#sync{font-size:12px;color:var(--muted);text-align:right;min-width:20px}

main{padding:4px 16px calc(110px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}

/* ---------- Apačia ---------- */
nav#tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:28px;box-shadow:var(--shadow);padding:6px;max-width:560px;margin:0 auto}
nav#tabs button{background:none;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:18px}
nav#tabs button b{display:block;font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.7;transition:all .2s}
nav#tabs button.on{color:var(--text)}
nav#tabs button.on b{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
nav#tabs .fab{width:62px;height:62px;border-radius:50%;margin:-26px auto 0;background:var(--grad);color:#fff;font-size:28px;display:grid;place-items:center;
  box-shadow:0 10px 24px rgba(168,85,247,.45),0 0 0 5px var(--bg);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 24px rgba(168,85,247,.45),0 0 0 5px var(--bg)}50%{box-shadow:0 10px 32px rgba(236,72,153,.6),0 0 0 5px var(--bg)}}

/* ---------- Diena ---------- */
.wkhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.wkhead div{font:700 15px var(--font)}
.wkhead button{width:40px;height:40px;padding:0;font-size:20px;border-radius:50%;box-shadow:var(--shadow2)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.strip button{padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow2);border-radius:16px}
.strip span{font-size:11px;color:var(--muted);font-weight:600}
.strip b{font:700 18px var(--font)}
.strip i{display:flex;gap:2px;height:5px}
.strip i u{width:5px;height:5px;border-radius:50%;background:var(--c)}
.strip button.today b{color:#a855f7}
.strip button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(168,85,247,.35)}
.strip button.on span,.strip button.on b{color:#fff}
.strip button.on u{background:#fff!important}

.hero{border-radius:var(--r);padding:16px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  background:linear-gradient(135deg,var(--c),var(--c2))}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero small{opacity:.9;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.hero h2{margin:4px 0 2px;font-size:24px;font-weight:800}
.hero .meta{opacity:.92;font-size:14px}
.hero .big{position:absolute;right:16px;bottom:8px;font-size:54px;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.hero .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:12px;overflow:hidden;width:70%}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:3px}

.chiprow{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow button{flex:none;font-size:14px;font-weight:600;box-shadow:var(--shadow2);border-radius:999px;padding:9px 14px}
.warn{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;border-radius:16px;padding:10px 12px;margin-bottom:12px;font-size:14px}
@media (prefers-color-scheme: dark){.warn{background:linear-gradient(135deg,#3b2f0b,#4a3708);color:#fde68a}}

.cols{display:grid;grid-template-columns:46px 1fr 1fr;align-items:center;margin-bottom:6px;font-weight:700;font-size:14px}
.cols>div{display:flex;align-items:center;justify-content:center;gap:6px}
.tl{position:relative;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow2)}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.hr span{position:absolute;left:8px;top:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.area{position:absolute;top:0;bottom:0;left:46px;right:0}
.blk{position:absolute;overflow:hidden}
.blk.sleep{background:var(--sleep);font-size:12px;color:var(--sleepT);display:flex;align-items:center;justify-content:center;gap:4px;font-weight:600}
.blk.work{background:repeating-linear-gradient(-45deg,var(--work) 0 8px,var(--workS) 8px 16px);font-size:12px;color:var(--muted);padding:5px 8px;font-weight:600}
.item{position:absolute;padding:2px 3px;z-index:2}
.item>div{height:100%;border-radius:14px;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:5px 8px;overflow:hidden;font-size:13px;cursor:pointer;
  box-shadow:0 4px 12px color-mix(in srgb,var(--c) 35%,transparent);transition:transform .12s}
.item>div:active{transform:scale(.97)}
.item b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;opacity:.9;font-size:11px}
.item.done>div{filter:saturate(.35);opacity:.75}
.item.done>div::after{content:"✓";position:absolute;right:10px;top:4px;font-weight:800;background:#fff;color:var(--ok);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:12px}
.item .ev{background:linear-gradient(135deg,#334155,#64748b)}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--danger);z-index:5}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

/* ---------- Kortelės ---------- */
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow2)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11px;font-weight:700;color:#fff;background:var(--grad);border-radius:999px;padding:2px 8px}
.wrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer;align-items:center}
.wrow:first-of-type{border-top:0}
.wrow .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--c),var(--c2));flex:none}
.wrow .tx{flex:1;min-width:0}
.wrow .tx small{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.wrow.done .tx b{text-decoration:line-through;opacity:.6}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

/* ---------- Tikslai ---------- */
.score{border-radius:var(--r);padding:18px;color:#fff;background:var(--grad);box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;margin-bottom:14px}
.score h2{margin:0;font-size:22px;font-weight:800}
.score p{margin:4px 0 0;opacity:.92;font-size:14px}
.ring{--p:0;--c:#fff;width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.28) 0)}
.ring>span{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--font);background:rgba(0,0,0,.08)}
.goals{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.goal{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow2);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.goal .ring{width:76px;height:76px;background:conic-gradient(var(--c) calc(var(--d)*1%),color-mix(in srgb,var(--c) 40%,transparent) 0 calc(var(--p)*1%),var(--line) 0)}
.goal .ring>span{width:60px;height:60px;background:var(--card);font-size:26px}
.goal b{font-size:14px}
.goal small{color:var(--muted);font-size:12px}
.goal.full .ring>span{animation:pop .6s ease}
@keyframes pop{50%{transform:scale(1.15)}}

/* ---------- Nustatymai ---------- */
.set h2{font-size:18px;font-weight:800;margin:20px 0 10px}
.row{display:flex;gap:8px;align-items:end;margin-bottom:10px}
.row label{flex:1;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0;font-weight:600}
.row.end{justify-content:flex-end}
.row.end button{background:var(--card2)}
.act{border-left:6px solid var(--c)}
.emo{width:60px!important;flex:none;text-align:center;font-size:22px!important;padding:6px!important}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}
.wt{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;font-weight:700;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;background:none;font-weight:700;border-radius:11px;padding:9px 6px}
.seg button.on{background:var(--card);box-shadow:var(--shadow2)}
.btn-grad{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(168,85,247,.35)}
.btn-soft{background:var(--card2);font-weight:600}
.btn-danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{flex:1 1 auto}

/* ---------- Lapai (sheets) ---------- */
.sheet{position:fixed;top:0;left:0;right:0;bottom:var(--kb,0px);z-index:50;background:rgba(10,5,30,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet-card{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.sheet.open .sheet-card{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px;flex:none}
.sh-hero{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--c),var(--c2));display:flex;gap:12px;align-items:center}
.sh-hero .e{font-size:40px}
.sh-hero h3{margin:0;font-size:20px;font-weight:800}
.sh-hero small{opacity:.92}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:18px;padding:14px 10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:#fff}
.tile span{font-size:24px}
.t-ok{background:linear-gradient(135deg,#10b981,#34d399)}
.t-move{background:linear-gradient(135deg,#f97316,#fbbf24)}
.t-del{background:linear-gradient(135deg,#ef4444,#f472b6)}
.t-undo{background:linear-gradient(135deg,#64748b,#94a3b8)}
.sheet-card label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:600}

/* ---------- Asistentas ---------- */
body.kb .sheet-card{max-height:calc(var(--vvh,100vh) - 12px);border-radius:24px 24px 0 0;padding-bottom:10px}
#chat .sheet-card{height:min(88vh, calc(var(--vvh,100vh) - 12px));padding-bottom:calc(10px + env(safe-area-inset-bottom));gap:8px}
.chat-head{display:flex;align-items:center;gap:10px}
.chat-head .bot{width:40px;height:40px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:22px}
.chat-head b{font:800 18px var(--font);flex:1}
.chat-head small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.chat-head button{background:var(--card2);border-radius:50%;width:36px;height:36px;padding:0}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:88%;padding:10px 13px;border-radius:20px;font-size:15px;line-height:1.4;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.bot{background:var(--card2);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg.wide{max-width:100%;width:100%;padding:0;background:none}
.prop{background:var(--card2);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.prop .ph{display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--c),var(--c2))}
.prop .ph .e{font-size:30px}
.prop .ph b{font-size:17px;display:block}
.prop .ph small{opacity:.92}
.prop .lbl{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{background:var(--card);padding:7px 11px;font-size:14px;font-weight:600;border-radius:999px;box-shadow:var(--shadow2)}
.pchips button.on{background:var(--grad);color:#fff}
.pchips input{width:auto;padding:6px 10px;border-radius:999px}
.note{font-size:13px;color:var(--muted)}
.conf{font-size:13px;background:color-mix(in srgb,#f59e0b 14%,transparent);border-radius:12px;padding:7px 10px}
.prop.closed{border-style:dashed;opacity:.8}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;padding:2px}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;background:var(--card2);border-radius:999px;font-size:13px;font-weight:600;padding:8px 12px}
.composer{display:flex;gap:8px;flex:none}
.composer input{border-radius:999px;padding:12px 16px;font-size:16px}
.composer button{border-radius:50%;width:48px;height:48px;padding:0;flex:none;font-size:20px}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#17142b;color:#fff;padding:11px 16px;border-radius:16px;font-size:14px;font-weight:600;
  opacity:0;transition:all .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%)}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:70;pointer-events:none}
#upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 78px);z-index:45;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:18px;
  background:var(--grad);color:#fff;font-weight:700;font-size:14px;box-shadow:0 10px 28px rgba(168,85,247,.45);max-width:560px;margin:0 auto;animation:in .3s ease}
#upd span{flex:1}
.ag{display:flex;flex-direction:column;gap:8px}
.ag-row{display:flex;gap:10px;align-items:stretch}
.ag-t{width:48px;flex:none;text-align:right;font:700 14px var(--font);padding-top:11px;font-variant-numeric:tabular-nums}
.ag-t small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.ag-card{flex:1;min-width:0;border-radius:18px;padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 4px 14px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .12s}
.ag-card:active{transform:scale(.98)}
.ag-card .e{font-size:26px}
.ag-card .tx{flex:1;min-width:0}
.ag-card .tx b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-card .tx small{opacity:.9;font-size:13px}
.ag-card.done{filter:saturate(.35);opacity:.7}
.ag-card.done .tx b::after{content:" ✓"}
.ag-card.work{background:repeating-linear-gradient(-45deg,var(--work) 0 8px,var(--workS) 8px 16px);color:var(--muted);box-shadow:none;padding:9px 14px;font-size:14px;font-weight:600;justify-content:space-between}
.ag-card.gap{background:none;border:2px dashed color-mix(in srgb,#a855f7 45%,transparent);color:var(--muted);box-shadow:none;padding:9px 14px;font-size:14px;justify-content:space-between}
.ag-card.gap b{color:#a855f7}
.ag-now{display:flex;align-items:center;gap:8px;color:var(--danger);font-weight:800;font-size:12px;padding-left:12px}
.ag-now::after{content:"";flex:1;border-top:2px solid var(--danger)}
.ag-edge{color:var(--muted);font-size:13px;font-weight:600;padding:2px 0 2px 58px}
.add-big{width:100%;margin-top:14px;padding:15px;border-radius:18px;border:2px dashed #a855f7;background:none;color:#a855f7;font-weight:800;font-size:16px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

<script>
// =============== Versija ===============
// Kiekvieną kartą keičiant programą – padidinti versiją ir įrašyti, kas naujo.
const APP_VERSION = '2.0';
const WHATS_NEW = [
  '🏄 Surf pagal tikras Lomboko bangas, vėją ir potvynius',
  '✨ Vedlys – planas pagal jūsų tikrą gyvenimą',
  '❤️ Reakcijos žinutėms, „Matė ✓✓“ ir 💗 „Pagalvojau apie tave“',
  '🔥 Serijos, 🏅 pasiekimai ir 📊 savaitės apžvalga',
  '🎲 „Ką veiksim?“ ruletė laisvam laikui',
  '↩︎ Atšaukti, 🔁 kartoti kas savaitę, 💾 kopija, 👫 Mano/Mūsų diena',
  '⚡ Žinutės ir pakeitimai – akimirksniu',
];

// =============== Pagalbinės ===============
const $ = s => document.querySelector(s);
const DAYS = ['Pr','An','Tr','Kt','Pn','Št','Sk'];
const DAYS_LONG = ['Pirmadienis','Antradienis','Trečiadienis','Ketvirtadienis','Penktadienis','Šeštadienis','Sekmadienis'];
const DAYKEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const MONTHS = ['saus.','vas.','kov.','bal.','geg.','birž.','liep.','rugp.','rugs.','spal.','lapkr.','gruod.'];
const BUF = 15, STEP = 15;
const toMin = s => { if(!s) return 0; const [h,m] = s.split(':').map(Number); return h*60 + (m||0); };
const toHM = m => String(Math.floor(m/60)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const weekStart = s => { const d = parseYmd(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const dayIdx = s => (parseYmd(s).getDay()+6)%7;
const today = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => { const d = parseYmd(s); return d.getDate()+' '+MONTHS[d.getMonth()]; };
const weekLabel = ws => fmtDate(ws) + ' – ' + fmtDate(addDays(ws,6));
const fmtDur = m => m < 60 ? m + ' min' : Math.floor(m/60) + ' val' + (m%60 ? ' ' + m%60 + ' min' : '');
const dayName = d => d === today() ? 'Šiandien' : d === addDays(today(),1) ? 'Rytoj' : DAYS_LONG[dayIdx(d)];
const shade = (h, p) => { const n = parseInt(h.slice(1),16); const f = c => Math.round(c + (255-c)*p); return '#' + [n>>16, n>>8&255, n&255].map(c => f(c).toString(16).padStart(2,'0')).join(''); };
const cvars = c => `--c:${c};--c2:${shade(c,.35)}`;
const parseRanges = str => (str||'').split(/[,;]/).map(x => x.trim()).filter(Boolean).map(x => {

async function checkUpdate(manual, auto) {

    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) {

      const busy = sheetEl.classList.contains('open') || chatEl.classList.contains('open') || /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
      if (auto && !busy) { doUpdate(); return true; }
      showUpdate(m[1]); return true;
    }
    if (manual) toast('Turite naujausią versiją ✓ (v' + APP_VERSION + ')');
  } catch (e) { if (manual) toast('Nepavyko patikrinti – nėra interneto'); }

let AC = null;

  const a = ac(); if (!a) return;
  const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}

  const a = ac(); if (!a) return;
  const len = a.sampleRate * .7, buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.setValueAtTime(3000, a.currentTime); f.frequency.exponentialRampToValueAtTime(120, a.currentTime + .6);
  g.gain.value = .55; s.connect(f).connect(g).connect(a.destination); s.start();

}

  // linksma melodija: C–E–G–C ir „žvaigždučių“ arpeggio

  [[1568, 1.3], [2093, 1.38], [2637, 1.46], [3136, 1.54]].forEach(([f, t]) => tone(f, t, .25, 'sine', .05));
  [262, 330, 392].forEach(f => tone(f, 1.15, 1.1, 'triangle', .07));
}

const weekNav = ws => `<div class="wkhead"><button data-nav="-7" aria-label="Ankstesnė savaitė">‹</button><div>${weekLabel(ws)}</div><button data-nav="7" aria-label="Kita savaitė">›</button></div>`;

function heroCard() {
  const d = view.date, n = nowMin();
  const its = state.items.filter(it => it.date === d).sort((a, b) => a.start - b.start);
  const done = its.filter(it => it.status === 'done').length;
  const bar = its.length ? `<div class="bar"><i style="width:${Math.round(done / its.length * 100)}%"></i></div><div class="meta" style="margin-top:6px">Atlikta ${done} iš ${its.length}</div>` : '';
  if (d === today()) {
    const cur = its.find(it => it.start <= n && n < it.start + it.dur && it.status !== 'done');
    const next = its.find(it => it.start > n && it.status !== 'done');
    const it = cur || next;
    if (it) {
      const m = itemMeta(it);
      const when = cur ? 'Dabar · liko ' + fmtDur(it.start + it.dur - n) : 'Toliau · po ' + fmtDur(it.start - n);
      return `<div class="hero" style="${cvars(m.color)}" data-item="${it.id}"><small>${when}</small><h2>${esc(m.name)}</h2>
        <div class="meta">${toHM(it.start)}–${toHM(it.start + it.dur)} · ${esc(whoLabel(it.who))}</div>${bar}<div class="big">${m.emoji}</div></div>`;
    }
    return `<div class="hero" style="${cvars('#a855f7')}"><small>Šiandien</small><h2>Diena baigta 🎉</h2><div class="meta">Mėgaukitės laisvu laiku</div>${bar}<div class="big">🌴</div></div>`;
  }
  const first = its[0];
  return `<div class="hero" style="${cvars('#6366f1')}"><small>${dayName(d)}, ${fmtDate(d)}</small><h2>${its.length ? its.length + ' užsiėmim' + (its.length === 1 ? 'as' : its.length < 10 ? 'ai' : 'ų') : 'Laisva diena'}</h2>
    <div class="meta">${first ? 'Pradžia ' + toHM(first.start) + ' · ' + itemMeta(first).emoji + ' ' + esc(itemMeta(first).name) : 'Nieko nesuplanuota'}</div>${bar}<div class="big">${d < today() ? '📖' : '🗓️'}</div></div>`;
}

function renderDay(main) {
  const ws = weekStart(view.date); ensureWeek(ws);
  let h = weekNav(ws) + '<div class="strip">' + [...Array(7)].map((_, i) => {
    const d = addDays(ws, i);
    const dots = state.items.filter(it => it.date === d).sort((a, b) => a.start - b.start).slice(0, 4).map(it => `<u style="--c:${itemMeta(it).color}"></u>`).join('');
    return `<button class="${d === view.date ? 'on' : ''} ${d === today() ? 'today' : ''}" data-date="${d}"><span>${DAYS[i]}</span><b>${parseYmd(d).getDate()}</b><i>${dots}</i></button>`;
  }).join('') + '</div>';
  h += heroCard();
  h += surfStrip(view.date);
  const tlMode = ls.get('rutina.mode') === 'tl';
  h += `<div class="chiprow"><button class="btn-grad" data-act="add">＋ Pridėti</button><button data-act="roulette">🎲 Ką veiksim?</button><button data-act="ping">💗 Pagalvojau</button><button data-act="mode">${tlMode ? '📋 Sąrašas' : '🕒 Laiko juosta'}</button><button data-act="work">💻 Darbas šią dieną</button></div>`;
  if (!tlMode) { main.innerHTML = h + agenda(view.date); return; }
  h += `<div class="cols"><div></div>${state.people.map(p => `<div>${av(p.id, 'sm')} ${esc(p.name)}</div>`).join('')}</div>`;

  const t0 = Math.max(0, Math.floor(Math.min(...state.people.map(p => toMin(p.wake))) / 60) * 60 - 60);
  const t1 = 1440, PX = 1.25;
  const y = m => ((m - t0) * PX).toFixed(1);
  let tl = `<div class="tl" style="height:${(t1 - t0) * PX}px">`;
  for (let m = t0; m < t1; m += 60) tl += `<div class="hr" style="top:${y(m)}px"><span>${toHM(m)}</span></div>`;
  tl += `<div class="area" data-t0="${t0}" data-px="${PX}">`;
  state.people.forEach((p, ci) => {
    const [w, s] = awake(p.id), left = ci * 50;
    if (w > t0) tl += `<div class="blk sleep" style="top:0;height:${y(w)}px;left:${left}%;width:50%">🌙 iki ${toHM(w)}</div>`;
    if (s < t1) tl += `<div class="blk sleep" style="top:${y(s)}px;height:${((t1 - s) * PX).toFixed(1)}px;left:${left}%;width:50%">😴 ${toHM(s)}</div>`;
    workRanges(p.id, view.date).forEach(([a, b]) => { tl += `<div class="blk work" data-act="work" style="top:${y(a)}px;height:${((b - a) * PX).toFixed(1)}px;left:${left}%;width:50%">💻 Darbas<br>${toHM(a)}–${toHM(b)}</div>`; });
  });
  state.items.filter(it => it.date === view.date).sort((a, b) => a.start - b.start).forEach(it => {
    const m = itemMeta(it);
    const both = it.who.length === 2, left = both ? 0 : (it.who[0] === 'a' ? 0 : 50), width = both ? 100 : 50;
    const hgt = Math.max(it.dur * PX, 26);
    tl += `<div class="item ${it.status === 'done' ? 'done' : ''}" style="top:${y(it.start)}px;height:${hgt}px;left:${left}%;width:${width}%;${cvars(m.color)}">
      <div data-item="${it.id}"><b>${m.emoji} ${esc(m.name)}</b>${hgt > 40 ? `<small>${toHM(it.start)}–${toHM(it.start + it.dur)}${both ? ' · abu' : ''}</small>` : ''}</div></div>`;
  });
  if (view.date === today()) { const n = nowMin(); if (n > t0) tl += `<div class="now" style="top:${y(n)}px"></div>`; }
  tl += '</div></div><div class="hint" style="text-align:center;margin-top:8px">Paspauskite tuščią vietą – pridėsite veiklą tuo laiku</div>';
  main.innerHTML = h + tl;
}

// Laisvi bendri langai (abu nemiega, nedirba ir neturi plano)
function freeGaps(date, min = 45) {
  const pids = ['a', 'b'];
  const from = Math.max(minStartFor(date), ...pids.map(p => awake(p)[0]));
  if (from === Infinity) return [];
  const end = Math.min(...pids.map(p => awake(p)[1]));
  const out = []; let s = null, t = Math.ceil(from / STEP) * STEP;
  for (; t + STEP <= end; t += STEP) {
    const f = isFree(pids, date, t, t + STEP);
    if (f && s == null) s = t;
    if (!f && s != null) { if (t - s >= min) out.push([s, t]); s = null; }
  }
  if (s != null && t - s >= min) out.push([s, t]);
  return out;
}
// Paprastas dienos sąrašas
function agenda(d) {
  const rows = [], groups = {}, F = ls.get('rutina.filter'); // filtras: visi / tik Paulius / tik Milda
  const seg = `<div class="seg mini fseg">${[['all', '👫 Mūsų diena'], ...state.people.map(p => [p.id, (p.id === Me() ? '🙋 ' : '') + p.name])].map(([v, n]) => `<button data-filter="${v}" class="${(F || 'all') === v ? 'on' : ''}">${esc(n)}</button>`).join('')}</div>`;
  const sid = surfAct()?.id;
  // ta pati veikla tuo pačiu metu abiem – viena kortelė
  state.items.filter(it => it.date === d && (!F || it.who.includes(F))).forEach(it => {
    const k = [it.kind, it.actId || it.title, it.start, it.dur, it.status].join('|');
    (groups[k] = groups[k] || []).push(it);
  });
  Object.values(groups).forEach(g => {
    const it = g[0], m = itemMeta(it), who = state.people.map(p => p.id).filter(id => g.some(x => x.who.includes(id)));
    rows.push({ t: it.start, html: `<div class="ag-row sw-row"><div class="ag-t">${toHM(it.start)}<small>${fmtDur(it.dur)}</small></div>
      <div class="ag-swipe"><span class="l">${it.status === 'done' ? '↩︎ Neatlikta' : '✓ Atlikta'}</span><span class="r">Perkelti ↪︎</span></div>
      <div class="ag-card ${it.status === 'done' ? 'done' : ''}" data-item="${g.map(x => x.id).join(',')}" style="${cvars(m.color)}"><span class="e">${m.emoji}</span>
      <span class="tx"><b>${esc(m.name)}</b><small>${toHM(it.start)}–${toHM(it.start + it.dur)}${(n => n ? ' · 💬 ' + n : '')(commentsOf(g).length)}${it.actId === sid && Surf.data?.[d] ? ' · ' + Surf.stars(Surf.score(d, it.start, it.dur)) : ''}${it.series ? ' · 🔁' : ''}</small></span>${avs(who)}</div></div>` });
  });
  const wk = {};
  state.people.filter(p => !F || p.id === F).forEach(p => workRanges(p.id, d).forEach(([a, b]) => { (wk[a + '-' + b] = wk[a + '-' + b] || { a, b, who: [] }).who.push(p.id); }));
  Object.values(wk).forEach(w => rows.push({ t: w.a, html: `<div class="ag-row"><div class="ag-t">${toHM(w.a)}</div>
    <div class="ag-card work" data-act="work"><span>💻 Darbas ${toHM(w.a)}–${toHM(w.b)}</span>${avs(w.who)}</div></div>` }));
  if (!F) freeGaps(d).forEach(([a, b]) => rows.push({ t: a + 0.1, html: `<div class="ag-row"><div class="ag-t">${toHM(a)}</div>
    <div class="ag-card gap" data-addat="${a}"><span><b>＋ Laisva kartu</b> ${toHM(a)}–${toHM(b)}</span><small>${fmtDur(b - a)}</small></div></div>` }));
  if (d === today()) { const n = nowMin(); rows.push({ t: n - 0.2, html: `<div class="ag-now">dabar ${toHM(n)}</div>` }); }
  rows.sort((x, y) => x.t - y.t);
  const PP = state.people.filter(p => !F || p.id === F);
  const wake = PP.map(p => `${esc(p.name)} ${p.wake}`).join(' · '), sleep = PP.map(p => `${esc(p.name)} ${p.sleep}`).join(' · ');
  const body = rows.length ? rows.map(r => r.html).join('') : '<div class="empty" style="text-align:center;padding:20px">Šiai dienai nieko nėra 🌴</div>';
  const hint = !ls.get('rutina.swipehint') && rows.length ? (ls.set('rutina.swipehint', '1'), '<div class="hint" style="text-align:center">💡 Brūkštelėkite veiklą → atlikta, ← perkelti. Dieną braukite ← →</div>') : '';
  return `${seg}${hint}<div class="ag"><div class="ag-edge">☀️ Keliasi: ${wake}</div>${body}<div class="ag-edge">🌙 Miegas: ${sleep}</div></div>
    <button class="add-big" data-act="add">＋ Pridėti veiklą</button>`;
}

// ＋ Pridėti: pasirinkti veiklą → patikslinti → įtraukti
function addSheet(date, start) {
  view.addCtx = { date: date || view.date, start: start ?? null };
  openSheet(`<h3 style="margin:0">＋ Ką pridėti?</h3>
    <div class="hint" style="margin:0">${dayName(view.addCtx.date)}, ${fmtDate(view.addCtx.date)}${start != null ? ' · nuo ' + toHM(start) : ' · laiką parinksiu pats'}</div>
    <div class="pick">${state.acts.map(a => `<button data-pick="${a.id}" style="${cvars(a.color)}"><span>${a.emoji}</span>${esc(a.name)}</button>`).join('')}
      <button data-pick="event" style="${cvars('#475569')}"><span>📌</span>Kita veikla</button>
      <button data-pick="roulette" style="${cvars('#db2777')}"><span>🎲</span>Ką veiksim?</button></div>`);
}
function pickAdd(id) {
  const ctx = view.addCtx || { date: view.date, start: null }, me = Me();
  if (id === 'roulette') return rouletteSheet(ctx.start);
  let p;
  if (id === 'event') p = { kind:'event', title:'', emoji:'📌', color:'#475569', date: ctx.date, start: ctx.start, dur: 60, durKnown: false, who: me ? [me] : ['a', 'b'], origin:'sheet' };
  else {
    const a = actById(id); if (!a) return;
    p = { kind:'act', actId: a.id, emoji: a.emoji, title: a.name, color: a.color, date: ctx.date, start: ctx.start, dur: a.dur, durKnown: true, who: a.who === 'each' ? [me || 'a'] : groupsFor(a)[0], origin:'sheet' };
  }
  if (!prepProp(p)) return toast(ctx.date < today() ? 'Ši diena jau praėjo' : 'Tą dieną laisvo laiko nerandu – pasirinkite kitą dieną ar laiką');
  sheetEl.querySelector('.sheet-card').innerHTML = `<div class="grab"></div><div id="propbox">${propCard(p)}</div>`;
  if (id === 'event') setTimeout(() => sheetEl.querySelector('[data-pf=title]')?.focus(), 60);
}

function weekStats(ws) {
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const rows = [];
  for (const act of state.acts) {
    if (!act.on || !act.perWeek) continue;
    for (const pids of groupsFor(act)) {
      const its = state.items.filter(it => it.actId === act.id && days.includes(it.date) && sameWho(it.who, pids));
      rows.push({ act, pids, planned: its.length, done: its.filter(it => it.status === 'done').length, goal: act.perWeek });
    }
  }
  return rows;
}

function renderWeek(main) {
  const ws = weekStart(view.date); ensureWeek(ws);
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  let h = weekNav(ws) + goalsBlock(ws) + warnBox();
  days.forEach((d, i) => {
    const its = state.items.filter(it => it.date === d).sort((a, b) => a.start - b.start);
    h += `<div class="card"><h3>${DAYS_LONG[i]} <span style="color:var(--muted);font-weight:600">${fmtDate(d)}</span>${d === today() ? '<span class="tag">šiandien</span>' : ''}</h3>`;
    if (!its.length) h += '<div class="empty">Laisva diena 🌴</div>';
    its.forEach(it => {
      const m = itemMeta(it);
      h += `<div class="wrow ${it.status === 'done' ? 'done' : ''}" data-item="${it.id}" style="${cvars(m.color)}"><span class="ic">${m.emoji}</span>
        <span class="tx"><b>${esc(m.name)}</b><small>${toHM(it.start)}–${toHM(it.start + it.dur)}</small></span>${avs(it.who)}</div>`;
    });
    h += '</div>';
  });
  h += `<div class="btns"><button class="btn-grad" data-act="review">📊 Savaitės apžvalga</button>${surfAct() ? '<button class="btn-soft" data-act="surf">🏄 Surf prognozė</button>' : ''}<button class="btn-soft" data-act="gen">🔀 Perdėlioti savaitę</button><button class="btn-soft" data-act="ics">📲 Į Apple kalendorių</button></div>`;
  main.innerHTML = h;
}

function goalsBlock(ws) {
  const rows = weekStats(ws);
  const goal = rows.reduce((s, r) => s + r.goal, 0) || 1, done = rows.reduce((s, r) => s + Math.min(r.done, r.goal), 0);
  const pct = Math.round(done / goal * 100);
  const mood = pct >= 100 ? 'Tobula savaitė! 🏆' : pct >= 70 ? 'Puikiai sekasi! 🔥' : pct >= 40 ? 'Gerai einasi 💪' : pct > 0 ? 'Geras startas 🌱' : 'Savaitė prasideda ✨';
  const st = streakTogether();
  let h = `<div class="score" data-act="review"><div class="ring" style="--p:${pct}"><span>${pct}%</span></div><div><h2>${mood}</h2><p>Atlikta ${done} iš ${goal} savaitės tikslų</p><p class="sm">📊 Paspauskite – savaitės apžvalga</p></div></div>
    <div class="chiprow streaks"><span>🔥 Kartu ${st} d. iš eilės</span>${state.people.map(p => `<span>${av(p.id, 'sm')} ${streak(i => i.who.includes(p.id))} d.</span>`).join('')}<span>🏅 ${BADGES.filter(b => b.ok()).length}/${BADGES.length}</span></div><div class="goals mini">`;
  rows.forEach(r => {
    const d = Math.min(100, Math.round(r.done / r.goal * 100)), p = Math.min(100, Math.round(r.planned / r.goal * 100));
    h += `<div class="goal ${r.done >= r.goal ? 'full' : ''}" style="--c:${r.act.color}"><div class="ring" style="--d:${d};--p:${p}"><span>${r.act.emoji}</span></div>
      <small>${r.pids.length === 1 ? esc(person(r.pids[0]).name[0]) + ' · ' : ''}${r.done}/${r.goal}</small></div>`;
  });
  return h + '</div>';
}
function renderGoals(main) {
  const ws = weekStart(view.date); ensureWeek(ws);
  const rows = weekStats(ws);
  const goal = rows.reduce((s, r) => s + r.goal, 0) || 1, done = rows.reduce((s, r) => s + Math.min(r.done, r.goal), 0);
  const pct = Math.round(done / goal * 100);
  const mood = pct >= 100 ? 'Tobula savaitė! 🏆' : pct >= 70 ? 'Puikiai sekasi! 🔥' : pct >= 40 ? 'Gerai einasi 💪' : pct > 0 ? 'Geras startas 🌱' : 'Savaitė prasideda ✨';
  let h = weekNav(ws);
  h += `<div class="score"><div class="ring" style="--p:${pct}"><span>${pct}%</span></div><div><h2>${mood}</h2><p>Atlikta ${done} iš ${goal} savaitės tikslų.<br>Pažymėkite ✓, kai padarote.</p></div></div>`;
  h += '<div class="goals">';
  rows.forEach(r => {
    const d = Math.min(100, Math.round(r.done / r.goal * 100)), p = Math.min(100, Math.round(r.planned / r.goal * 100));
    h += `<div class="goal ${r.done >= r.goal ? 'full' : ''}" style="--c:${r.act.color}"><div class="ring" style="--d:${d};--p:${p}"><span>${r.act.emoji}</span></div>
      <b>${esc(r.act.name)}</b><small>${r.pids.length === 1 ? esc(person(r.pids[0]).name) + ' · ' : ''}✓ ${r.done}/${r.goal}${r.planned < r.goal ? ' · ⚠️ suplanuota ' + r.planned : ''}</small></div>`;
  });
  h += '</div>';
  const per = state.people.map(p => {
    const n = state.items.filter(it => it.status === 'done' && it.who.includes(p.id) && weekStart(it.date) === ws).length;
    return `<div class="wrow" style="cursor:default">${av(p.id)}<span class="tx"><b>${esc(p.name)}</b><small>Šią savaitę atlikta: ${n}</small></span><span style="font-size:22px">${n >= 8 ? '🔥' : n >= 4 ? '💪' : '🌱'}</span></div>`;
  }).join('');
  h += `<div class="card" style="margin-top:12px"><h3>Kas kiek nuveikė</h3>${per}</div>`;
  main.innerHTML = h;
}

// =============== Lapai ===============
const sheetEl = $('#sheet');
function openSheet(html) { sheetEl.inert = false; sheetEl.innerHTML = `<div class="sheet-card"><div class="grab"></div>${html}</div>`; requestAnimationFrame(() => sheetEl.classList.add('open')); }
function closeSheet() { sheetEl.classList.remove('open'); sheetEl.inert = true; setTimeout(() => { if (!sheetEl.classList.contains('open')) sheetEl.innerHTML = ''; }, 300); }
let sheetItem = null, sheetGroup = [];

function itemSheet(ids) {
  const group = String(ids).split(',').map(id => state.items.find(x => x.id === id)).filter(Boolean);
  const it = group[0]; if (!it) return;
  sheetItem = it; sheetGroup = group; const m = itemMeta(it);
  const allWho = state.people.map(p => p.id).filter(id => group.some(x => x.who.includes(id)));
  const past = it.date < today(), done = it.status === 'done';
  openSheet(`<div class="sh-hero" style="${cvars(m.color)}"><span class="e">${m.emoji}</span><div><h3>${esc(m.name)}</h3>
      <small>${dayName(it.date)}, ${fmtDate(it.date)} · ${toHM(it.start)}–${toHM(it.start + it.dur)}</small><div style="margin-top:4px">${avs(allWho)}</div></div></div>
    <div class="tiles">
      <button class="tile ${done ? 't-undo' : 't-ok'}" data-sheet="done"><span>${done ? '↩︎' : '✓'}</span>${done ? 'Neatlikta' : 'Atlikta!'}</button>

function skipChat(act, dI, tm, who, t) {
  const pids = who || null;
  if (dI.target) {
    const from = dI.found ? [dI.date] : [...Array(7)].map((_, i) => addDays(today(), i)).filter(d => d !== dI.target);
    const match = x => x.actId === act.id && x.status === 'planned' && (!pids || overlaps(x.who, pids));
    // imame pirmą dieną, kurioje šis užsiėmimas yra ir kurio dar nėra tikslinėje dienoje
    const movable = x => match(x) && from.includes(x.date) && countOn(act.id, x.who, dI.target, x.id) === 0;
    const first = state.items.filter(movable).sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start)[0];
    if (!first) {
      const already = state.items.some(x => match(x) && x.date === dI.target);
      return botSay(already ? `${dayName(dI.target)} ${act.emoji} ${esc(act.name)} jau suplanuotas 👍` : `Nerandu suplanuoto ${act.emoji} ${esc(act.name)}, kurį galėčiau perkelti 🤔`);
    }
    const its = state.items.filter(x => movable(x) && x.date === first.date);
    const res = [];
    for (const it of its) {
      const who = it.who.length === 1 ? ' (' + esc(person(it.who[0]).name) + ')' : '';
      if (tm.start != null) { it.date = dI.target; it.start = tm.start; it.pinned = true; res.push(`${act.emoji} ${esc(act.name)}${who} → <b>${dayName(it.date)} ${toHM(it.start)}</b>`); }
      else if (rescheduleOtherDay(it, dI.target)) res.push(`${act.emoji} ${esc(act.name)}${who} → <b>${dayName(it.date)} ${toHM(it.start)}</b>`);
      else res.push(`${act.emoji} ${esc(act.name)}${who} – ${dayName(dI.target).toLowerCase()} netelpa 😕`);
    }
    its.forEach(it => logAct(`perkėlė ${act.emoji} ${act.name} → ${whenShort(it.date, it.start)}`, it.id));
    const ms = afterChange([dI.target]);
    const okN = res.filter(x => x.includes('→')).length;
    return botSay((okN ? 'Perkėliau ✅<br>' : 'Nepavyko perkelti – tą dieną nėra laisvo laiko. Parašykite su valanda, pvz. „perkelk gym į rytoj 7:00“.<br>') + res.join('<br>') + (ms.length ? '<br><span class="note">Pastumta: ' + esc(ms.join(', ')) + '</span>' : ''));

  const its = state.items.filter(x => x.actId === act.id && x.date === dI.date && x.status === 'planned' && (!pids || overlaps(x.who, pids)));
  if (!its.length) return botSay(`${dayName(dI.date)} ${act.emoji} ${esc(act.name)} ir taip nesuplanuotas 👍`);
  const res = its.map(it => rescheduleOtherDay(it) && (logAct(`perkėlė ${act.emoji} ${act.name} → ${whenShort(it.date, it.start)}`, it.id), true) ?`${act.emoji} ${esc(act.name)} → <b>${dayName(it.date)} ${toHM(it.start)}</b>` : `${act.emoji} ${esc(act.name)} – šią savaitę vietos neradau, pašalinau`);
  its.forEach(it => { if (it.date === dI.date) state.items = state.items.filter(x => x !== it); });
  render();
  botSay('Jokių problemų 😌 Perkėliau:<br>' + res.join('<br>'));
}

function workChat(t, dI, tm, who) {

function prepProp(p) {

    const cand = state.items.filter(x => x.actId === p.actId && x.status === 'planned' && weekStart(x.date) === weekStart(p.date) && x.date >= today() && sameWho(x.who, p.who))

    if (cand[0]) p.moveId = p.moveCand = cand[0].id;
  }
  if (p.start == null) {
    const act = p.kind === 'act' && actById(p.actId);
    let s = act ? findSlot(act, p.dur, p.who, p.date, minStartFor(p.date), p.moveId) : null;
    if (s == null) s = findSlot({ from:'08:00', to:'22:00' }, p.dur, p.who, p.date, minStartFor(p.date), p.moveId);

}

function propClick(c) {

function propChange(el) {

function conflicts(p) {
  const out = [];
  p.who.forEach(pid => workRanges(pid, p.date).forEach(([a, b]) => { if (p.start < b && p.start + p.dur > a) out.push('💻 ' + person(pid).name + ' dirba ' + toHM(a) + '–' + toHM(b)); }));
  state.items.forEach(it => {
    if (it.id === p.moveId || it.date !== p.date || !overlaps(it.who, p.who)) return;
    if (p.start < it.start + it.dur && p.start + p.dur > it.start) { const m = itemMeta(it); out.push(m.emoji + ' ' + m.name + ' ' + toHM(it.start) + (it.kind === 'auto' && !it.pinned ? ' – pastumsiu' : ' – kertasi!')); }
  });
  p.who.forEach(pid => { const [w, s] = awake(pid); if (p.start < w || p.start + p.dur > s) out.push('😴 ' + person(pid).name + ' tuo metu miega'); });
  return out;
}
function propCard(p) {

  const [A, B] = state.people;
  const whoBtn = (ids, label) => `<button data-pa="who" data-v="${ids.join(',')}" data-pid="${p.id}" class="${sameWho(p.who, ids) ? 'on' : ''}">${label}</button>`;
  const durs = [30, 60, 90, 120, 180];

    <div class="lbl">KAS</div><div class="pchips">${whoBtn(['a'], esc(A.name))}${whoBtn(['b'], esc(B.name))}${whoBtn(['a', 'b'], 'Abu 👫')}</div>

          fetch(`https://api.open-meteo.com/v1/forecast?${q}&hourly=wind_speed_10m,wind_direction_10m,weather_code,temperature_2m`).then(r => r.json()),
        ]);

        m.hourly.time.forEach((t, i) => {

            sd: m.hourly.swell_wave_direction[i], sea: m.hourly.sea_level_height_msl[i], w: w.hourly.wind_speed_10m[i], wd: w.hourly.wind_direction_10m[i], wc: w.hourly.weather_code[i], tc: w.hourly.temperature_2m[i] };
        });

  hour(date, m) { return this.data?.[date]?.h?.[Math.floor(m / 60)] || null; },
  // 0–10 balų už valandą: bangos aukštis pagal lygį, periodas, vėjas (offshore), potvynis
  hourScore(date, hr) {
    const day = this.data?.[date], o = day?.h?.[hr]; if (!o || hr < 6 || hr > 17 || o.h == null) return 0;

  },
  stars(sc) { const n = Math.max(0, Math.min(5, Math.round(sc / 2))); return '★'.repeat(n) + '☆'.repeat(5 - n); },
  label(sc) { return sc >= 8 ? 'Puikios 🔥' : sc >= 6.5 ? 'Geros 👍' : sc >= 5 ? 'Neblogos' : sc >= 3.5 ? 'Silpnos' : 'Prastos'; },
  tide(date, m) { const day = this.data?.[date], a = this.hour(date, m), b = this.hour(date, m + 60); if (!a || !b) return ''; const tn = (a.sea - day.lo) / ((day.hi - day.lo) || 1); return (b.sea > a.sea ? '↑ kyla' : '↓ slūgsta') + (tn > .75 ? ' (aukštas)' : tn < .25 ? ' (žemas)' : ' (vidutinis)'); },
  info(date, start) { const o = this.hour(date, start); if (!o) return ''; const s = spotOf(); const diff = 180 - Math.abs(((o.wd - s.off) % 360 + 540) % 360 - 180);
    return `${o.h.toFixed(1)} m · ${Math.round(o.p)} s · vėjas ${Math.round(o.w)} km/h ${compass(o.wd)}${diff < 50 ? ' (offshore 👌)' : diff < 100 ? ' (šoninis)' : ' (onshore)'} · potvynis ${this.tide(date, start)}`; },
  // geriausias laisvas langas dienai

};
// Surf veiklas savaitėje perdėlioti į geriausius bangų langus
function surfPlanWeek(ws) {
  const act = surfAct(); if (!act || !Surf.data) return 0;
  const days = [...Array(7)].map((_, i) => addDays(ws, i)).filter(d => minStartFor(d) !== Infinity);
  let moved = 0;
  for (const pids of groupsFor(act)) {
    const its = state.items.filter(x => x.actId === act.id && sameWho(x.who, pids) && days.includes(x.date) && x.status === 'planned' && !x.pinned && (x.date > today() || x.start > nowMin()));
    for (const it of its) {
      let best = null;
      for (const d of days) {
        if (d !== it.date && countOn(act.id, pids, d, it.id) > 0) continue;
        const b = Surf.best(d, it.dur, pids, minStartFor(d), it.id, act); if (b && (!best || b.sc > best.sc)) best = { ...b, d };
      }
      const cur = Surf.score(it.date, it.start, it.dur);
      if (best && best.sc > cur + .3) { it.date = best.d; it.start = best.t; moved++; }
    }
  }
  return moved;
}
// Pasiūlymas: ar yra žymiai geresnis langas suplanuotam surf?
function surfSuggestion() {
  const act = surfAct(); if (!act || !Surf.data) return null;
  const its = state.items.filter(x => x.actId === act.id && x.status === 'planned' && (x.date > today() || (x.date === today() && x.start > nowMin())) && weekStart(x.date) === weekStart(today()));
  let best = null;
  for (const it of its) {
    const cur = Surf.score(it.date, it.start, it.dur);
    for (let i = 0; i < 7; i++) {
      const d = addDays(today(), i); if (weekStart(d) !== weekStart(today())) continue;
      if (d !== it.date && countOn(act.id, it.who, d, it.id) > 0) continue;
      const b = Surf.best(d, it.dur, it.who, minStartFor(d), it.id, act);
      if (b && b.sc >= cur + 1.5 && (!best || b.sc - cur > best.gain)) best = { it, d, t: b.t, sc: b.sc, cur, gain: b.sc - cur };
    }
  }
  return best;
}

    const mb = e.target.closest('.mb[data-mid]'); if (!mb) return;
    if (Date.now() - lastTap.t < 380 && lastTap.id === mb.dataset.mid) { reactPicker(mb.dataset.mid, mb); lastTap = { t: 0, id: '' }; }
    else lastTap = { t: Date.now(), id: mb.dataset.mid };
  });
  $('#main').addEventListener('touchstart', e => { const mb = e.target.closest('.mb[data-mid]'); if (mb) lp = setTimeout(() => reactPicker(mb.dataset.mid, mb), 480); }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => $('#main').addEventListener(ev, () => clearTimeout(lp), { passive: true }));
  setInterval(() => { if (!document.hidden) checkUpdate(false); }, 10 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { Sync.pull().then(markSeen); render(); checkUpdate(false, true); } });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
